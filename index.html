<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herblox Platform | Konsol Deneyimi</title>
    <style>
        :root {
            --xbox-green: #107c10;
            --xbox-dark: #1a1a1a;
            --xbox-card: #2d2d2d;
            --xbox-hover: #3a3a3a;
        }

        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* 1. İMLEÇ: Sayfanın genel, boş alanları için imleç */
            cursor: url('boscursor.png'), auto;
        }

        /* Xbox Arka Plan Parıltısı */
        .bg-glow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, rgba(16,124,16,0.15) 0%, rgba(0,0,0,0) 60%);
            z-index: -1;
        }

        /* Navigasyon Barı */
        .navbar {
            display: flex;
            padding: 30px 60px;
            gap: 40px;
            font-size: 16px;
            font-weight: bold;
            color: #888;
        }

        .nav-item { transition: 0.3s; }
        .nav-item:hover { color: white; }
        .nav-item.active {
            color: white;
            border-bottom: 4px solid var(--xbox-green);
            padding-bottom: 8px;
        }

        /* Ana İçerik Alanı */
        .container {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 25px;
            padding: 0 60px 40px 60px;
            max-width: 1400px;
        }

        /* Xbox Kart Yapısı */
        .card {
            background: var(--xbox-card);
            border: 3px solid transparent;
            border-radius: 6px;
            padding: 25px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: scale(1.03);
            border-color: #ffffff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            background: var(--xbox-hover);
            /* 2. İMLEÇ: Kartın veya butonun üzerine geldiğinde (seçilebilir alan) imleç */
            cursor: url('secilicursor.png'), pointer;
        }

        /* Ana Hero Kartı */
        .hero-card {
            grid-row: span 2;
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 450px;
        }

        h1 { font-size: 48px; margin: 0 0 10px 0; }
        p { color: #bbb; font-size: 18px; line-height: 1.6; }

        /* Buton Grubu */
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }

        .xbox-btn {
            background: #404040;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .xbox-btn:hover { background: var(--xbox-green); }

        /* Durum Kartı (Doğrulanmış Karakter) */
        .status-card {
            text-align: center;
            background: var(--xbox-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .status-img {
            width: 180px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .status-text { font-size: 22px; font-weight: 800; }

        /* Alt Bilgi Kartı */
        .info-card { background: #1e1e1e; }
    </style>
</head>
<body onload="playSound('PencereAcSesi.mp3')">

    <div class="bg-glow"></div>

    <nav class="navbar">
        <div class="nav-item active">ANA SAYFA</div>
        <div class="nav-item">PROJELER</div>
        <div class="nav-item">API (BETA)</div>
    </nav>

    <div class="container">
        <div class="card hero-card" onmouseover="playSound('SecmeSesi.mp3')">
            <h1>Herblox Studio</h1>
            <p>Windows LTSC 2019 uyumlu, Roblox altyapılı Metro ve Asansör simülasyon sistemleri.</p>
            <div class="btn-group">
                <button class="xbox-btn" onclick="playSound('SatinalmaSesi.mp3')">💻 Windows İndir</button>
            </div>
        </div>

        <div class="card status-card" onmouseover="playSound('SolMenuSesi.mp3')">
            <img src="Dorulanmış.png" alt="Doğrulandı" class="status-img">
            <div class="status-text">SİSTEM DOĞRULANDI</div>
        22.42: Geliştirici Oturumu Aktif.
        </div>

        <div class="card info-card" onmouseover="playSound('SecmeOkSesi.mp3')">
            <h3>Hızlı Erişim</h3>
            <p style="font-size: 14px;">🚇 Metro Bilgi v2.1: AKTİF<br>🏗️ Asansör API: Hazır</p>
            <div style="margin-top: 15px; font-weight: bold; color: var(--xbox-green);">api.herblox.com</div>
        </div>
    </div>

    <script>
        function playSound(fileName) {
            var audio = new Audio(fileName);
            audio.play().catch(function(error) {
                console.log("Ses oynatılamadı (muhtemelen SecSesi.mp3 adını SecSesi.mp3 yapmadın): " + fileName);
            });
        }
    </script>
</body>
</html>
