<style>
    :root {
        --xbox-green: #107c10;
        --xbox-dark: #1a1a1a;
        --xbox-card: #2d2d2d;
    }

    body {
        background-color: #0a0a0a;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        overflow: hidden; /* Tam ekran konsol hissi */
    }

    /* Arka Plandaki Hafif Parıltı */
    .bg-glow {
        position: fixed;
        top: -50%; left: -50%;
        width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(16,124,16,0.1) 0%, rgba(0,0,0,0) 70%);
        z-index: -1;
    }

    /* Üst Menü */
    .navbar {
        display: flex;
        padding: 20px 50px;
        gap: 30px;
        font-size: 14px;
        font-weight: 600;
        color: #888;
    }

    .nav-item.active {
        color: white;
        border-bottom: 3px solid var(--xbox-green);
        padding-bottom: 5px;
    }

    /* Ana Panel Layout */
    .container {
        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-rows: auto auto;
        gap: 20px;
        padding: 0 50px;
    }

    /* Xbox Kart Tasarımı */
    .card {
        background: var(--xbox-card);
        border: 2px solid transparent;
        border-radius: 4px;
        padding: 20px;
        transition: 0.2s ease;
        position: relative;
    }

    .card:hover {
        transform: scale(1.02);
        border-color: white;
        box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    /* Sol Büyük Kart (İndirme Alanı) */
    .hero-card {
        grid-row: span 2;
        background: linear-gradient(45deg, #1a1a1a, #2d2d2d);
        min-height: 400px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }

    /* Sistem Durumu Kartı (Karakterin Olduğu Yer) */
    .status-card {
        background: #107c10;
        text-align: center;
    }

    .status-img {
        width: 150px;
        margin-bottom: 10px;
    }

    /* Butonlar */
    .xbox-btn {
        background: #333;
        color: white;
        border: none;
        padding: 12px 25px;
        margin: 5px;
        font-weight: bold;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }

    .xbox-btn:hover { background: var(--xbox-green); }

</style>

<div class="bg-glow"></div>

<nav class="navbar">
    <div class="nav-item active">ANA SAYFA</div>
    <div class="nav-item">MAĞAZA</div>
    <div class="nav-item">AYARLAR</div>
</nav>

<div class="container">
    <div class="card hero-card">
        <h1>Herblox Studio</h1>
        <p>Geleceğin oyun motoru sistemine hoş geldin.</p>
        <div>
            <button class="xbox-btn" onclick="playSelect()">📥 Windows İndir</button>
            <button class="xbox-btn" onclick="playSelect()">📱 Android İndir</button>
        </div>
    </div>

    <div class="card status-card">
        <img src="Dorulanmış.png" class="status-img">
        <h3>Sistem Doğrulandı</h3>
        <p>Cihazın Herblox için hazır!</p>
    </div>

    <div class="card">
        <h4>Hızlı Erişim</h4>
        <div style="font-size: 12px; color: #bbb;">
            🚇 Metro Test Sürüşü<br>
            🏗️ Asansör Mantık Testi
        </div>
    </div>
</div>

<script>
    function playSelect() {
        new Audio('SeçSesi.mp3').play();
    }
</script>
